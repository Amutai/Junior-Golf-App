name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: junior_golf_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore and build (excluding MAUI)
        run: |
          dotnet restore src/JuniorGolf.Core
          dotnet restore src/JuniorGolf.Shared
          dotnet restore src/JuniorGolf.Infrastructure
          dotnet restore src/JuniorGolf.AI
          dotnet restore src/JuniorGolf.Api
          dotnet restore src/JuniorGolf.Web
          dotnet restore src/JuniorGolf.Admin
          dotnet restore tests/JuniorGolf.Api.Tests
          dotnet restore tests/JuniorGolf.Core.Tests
          dotnet restore tests/JuniorGolf.Infrastructure.Tests

      - name: Build
        run: |
          dotnet build src/JuniorGolf.Api --no-restore --configuration Release
          dotnet build src/JuniorGolf.Web --no-restore --configuration Release
          dotnet build src/JuniorGolf.Admin --no-restore --configuration Release
          dotnet build tests/JuniorGolf.Api.Tests --no-restore --configuration Release
          dotnet build tests/JuniorGolf.Core.Tests --no-restore --configuration Release
          dotnet build tests/JuniorGolf.Infrastructure.Tests --no-restore --configuration Release

      - name: Test
        run: |
          dotnet test tests/JuniorGolf.Api.Tests --no-build --configuration Release --verbosity normal
          dotnet test tests/JuniorGolf.Core.Tests --no-build --configuration Release --verbosity normal
          dotnet test tests/JuniorGolf.Infrastructure.Tests --no-build --configuration Release --verbosity normal

  build-maui:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI workload
        run: dotnet workload install maui

      - name: Build MAUI app
        run: dotnet build src/JuniorGolf.App --configuration Release
