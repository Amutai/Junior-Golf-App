name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: junior_golf_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore --ignore-failed-sources
        env:
          DOTNET_SKIP_WORKLOAD_INTEGRITY_CHECK: true

      - name: Build (excluding MAUI)
        run: |
          dotnet build src/JuniorGolf.Api --no-restore --configuration Release
          dotnet build src/JuniorGolf.Web --no-restore --configuration Release
          dotnet build src/JuniorGolf.Admin --no-restore --configuration Release
          dotnet build src/JuniorGolf.Core --no-restore --configuration Release
          dotnet build src/JuniorGolf.Infrastructure --no-restore --configuration Release
          dotnet build src/JuniorGolf.AI --no-restore --configuration Release
          dotnet build src/JuniorGolf.Shared --no-restore --configuration Release
          dotnet build tests/JuniorGolf.Api.Tests --no-restore --configuration Release
          dotnet build tests/JuniorGolf.Core.Tests --no-restore --configuration Release
          dotnet build tests/JuniorGolf.Infrastructure.Tests --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal

  build-maui:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI workload
        run: dotnet workload install maui

      - name: Build MAUI app
        run: dotnet build src/JuniorGolf.App --configuration Release
